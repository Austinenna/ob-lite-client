[package]
name = "ob-lite-client"
version = "0.1.0"
description = "OB Lite Client — a lightweight OceanBase (MySQL mode) client"
authors = ["enna"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "ob_lite_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "rt", "macros", "sync"] }
mysql_async = { version = "0.36", default-features = false, features = ["default-rustls"] }
rusqlite = { version = "0.40", features = ["bundled"] }
keyring = { version = "3.6", features = ["apple-native"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
once_cell = "1"
futures-util = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
